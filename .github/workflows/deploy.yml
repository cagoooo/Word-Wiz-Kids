name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 📥
        uses: actions/checkout@v4

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies 🛠️
        run: pnpm install --no-frozen-lockfile

      - name: Inject Secrets into .env 🔑
        run: |
          cat << 'EOF' > ./artifacts/vocab-kids/.env
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}
          EOF

      - name: Generate stable release version 🏷️
        run: |
          # 同一 commit 重新執行 workflow 時版本必須保持不變，避免產生假 SW 更新。
          # run number 可排序，讓前端能拒絕 CDN 暫時回送的舊版 sw.js。
          BUILD_VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::12}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"

      - name: Build project 🏗️
        run: pnpm --filter ./artifacts/vocab-kids build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Inject build version into PWA files 🔄
        run: |
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" ./artifacts/vocab-kids/dist/public/sw.js
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" ./artifacts/vocab-kids/dist/public/version.json
          if grep -q '__BUILD_VERSION__' ./artifacts/vocab-kids/dist/public/sw.js ./artifacts/vocab-kids/dist/public/version.json; then
            echo "::error::PWA build version sentinel was not replaced"
            exit 1
          fi
          if ! grep -Eq 'const BUILD_VERSION = "[0-9]+-[0-9a-f]{12}";' ./artifacts/vocab-kids/dist/public/sw.js; then
            echo "::error::Service Worker build version is not stable/sortable"
            exit 1
          fi
          if ! grep -Fq "\"version\": \"${BUILD_VERSION}\"" ./artifacts/vocab-kids/dist/public/version.json; then
            echo "::error::version.json does not match Service Worker build version"
            exit 1
          fi
          if ! grep -Fq 'GET_VERSION' ./artifacts/vocab-kids/dist/public/sw.js; then
            echo "::error::Service Worker does not expose GET_VERSION"
            exit 1
          fi

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/vocab-kids/dist/public
