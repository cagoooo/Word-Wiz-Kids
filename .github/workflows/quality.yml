name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/vocab-kids run test:unit
      - run: pnpm --filter @workspace/vocab-kids run test:rules
      - run: pnpm --filter @workspace/vocab-kids run build
      - name: Install Playwright (chromium)
        # 下載站偶爾卡住：每次最多 3 分鐘，失敗重試一次，整步最多 8 分鐘就結束，不讓 job 卡到 60 分鐘
        timeout-minutes: 8
        run: |
          for i in 1 2; do
            timeout 180 pnpm --filter @workspace/vocab-kids exec playwright install --with-deps chromium && exit 0
            echo "第 $i 次安裝 Playwright 瀏覽器失敗或逾時"
          done
          exit 1
      - run: pnpm --filter @workspace/vocab-kids run test:e2e
